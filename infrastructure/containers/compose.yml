x-backend: &backend
  build:
    context: ../../backend
    dockerfile: Containerfile
  image: autoinvest-backend:local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoinvest}
      POSTGRES_USER: ${POSTGRES_USER:-autoinvest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoinvest}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoinvest} -d ${POSTGRES_DB:-autoinvest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.database.seed"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-with-at-least-32-bytes}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@autoinvest.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo1234}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autoinvest}:${POSTGRES_PASSWORD:-autoinvest}@postgres:5432/${POSTGRES_DB:-autoinvest}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-with-at-least-32-bytes}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@autoinvest.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo1234}
      INITIAL_CASH_BALANCE: ${INITIAL_CASH_BALANCE:-10000.00}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autoinvest}:${POSTGRES_PASSWORD:-autoinvest}@postgres:5432/${POSTGRES_DB:-autoinvest}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  market-data:
    <<: *backend
    command: ["python", "-m", "app.modules.market_data.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-with-at-least-32-bytes}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      MARKET_DATA_REFRESH_SECONDS: ${MARKET_DATA_REFRESH_SECONDS:-300}
      MARKET_DATA_RETENTION_DAYS: ${MARKET_DATA_RETENTION_DAYS:-30}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      BRAPI_BASE_URL: ${BRAPI_BASE_URL:-https://brapi.dev/api}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autoinvest}:${POSTGRES_PASSWORD:-autoinvest}@postgres:5432/${POSTGRES_DB:-autoinvest}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Containerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
