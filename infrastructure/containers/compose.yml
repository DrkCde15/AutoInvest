services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autoinvest
      POSTGRES_USER: autoinvest
      POSTGRES_PASSWORD: autoinvest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../../backend
      dockerfile: Containerfile
    environment:
      DATABASE_URL: postgresql+psycopg://autoinvest:autoinvest@postgres:5432/autoinvest
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Containerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
